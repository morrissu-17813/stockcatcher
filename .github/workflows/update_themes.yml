# .github/workflows/update_themes.yml
name: Weekly Concept Stock Update

on:
  schedule:
    # 每個週六凌晨 02:00 (UTC+8) 執行 (Cron 是 UTC 時間，所以寫 18:00)
    - cron: '0 18 * * 5'
  workflow_dispatch: # 允許在 GitHub 網頁上按按鈕手動觸發

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 自動快取依賴，加速執行

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安裝新的映射腳本所需的依賴套件
          pip install requests urllib3 supabase

      - name: 🚀 Run Concept Stock Mapper and Update Supabase
        env:
          # 這裡的變數將從 GitHub Secrets 中安全讀取
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd stockcatcher
          python concept_stock_mapper.py