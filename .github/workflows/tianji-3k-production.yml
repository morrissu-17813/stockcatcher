name: Tianji_3K_Production

on:
  # 手動測試入口
  workflow_dispatch: # 允許手動測試
  #    外部強迫喚醒：允許透過 API 觸發 (Repository Dispatch)
  repository_dispatch:
    types: [trigger-tianji-3k-production]

  # 每個交易日台灣時間 08:15 啟動
  # GitHub cron 使用 UTC
  # 08:15 Asia/Taipei = 00:15 UTC
  schedule:
    - cron: "15 0 * * 1-5"

concurrency:
  group: tianji-3k-production
  cancel-in-progress: false

jobs:
  tianji-3k-production:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            curl_cffi \
            python-dotenv \
            python-dateutil \
            FinMind>=1.5.4 \
            fugle-marketdata \
            supabase

      - name: 🔐 Check required secrets
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          required = [
              "FINMIND_TOKEN",
              "FUGLE_API_KEY",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]

          missing = [x for x in required if not os.environ.get(x)]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          print("All required secrets are present.")
          PY

      - name: 🚀 Start Tianji 3K Production
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "=========================================="
          echo "🚀 Tianji 3K Production"
          echo "=========================================="
          echo "Start time: $(date -u)"
          echo "Timezone  : Asia/Taipei"
          echo "=========================================="
      
          cd stockcatcher
          python -u -m tianji_3k

      - name: 📦 Upload Tianji runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianji-3k-runtime-${{ github.run_id }}
          path: |
            tianji_3k/logs/**
            tianji_3k/predictions/**
            tianji_3k/validation/**
            tianji_3k/cache/**
          if-no-files-found: ignore
          retention-days: 14