name: StockCatcher_Daily_Action

on:
  schedule:
    # 台北時間週一至週五 08:55 啟動 (UTC 00:55)
    - cron: '55 0 * * 1-5'
  workflow_dispatch: # 允許手動測試

jobs:
  run-stockcatcher:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 檢出專案代碼
        uses: actions/checkout@v3

      - name: 🐍 設定 Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 強制更新並安裝套件
        run: |
          python -m pip install --upgrade pip
          # 💡 蘇蘇提醒：這裡使用 --upgrade 確保抓到最新版 SDK，解決 AttributeError
          pip install --upgrade fugle-marketdata requests python-dotenv line-bot-sdk

      - name: 🚀 啟動 StockCatcher 監控引擎
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 💡 蘇蘇提醒：必須先 cd 進入子資料夾，否則程式會找不到 line_test.py
          cd stockcatcher
          python scanner.py