name: StockCatcher_Daily_Action

on:
  schedule:
    # 台北時間週一至週五 08:55 啟動 (UTC 00:55)
    - cron: '55 0 * * 1-5'
  workflow_dispatch: # 允許手動測試

jobs:
  run-stockcatcher:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 檢出專案代碼
        uses: actions/checkout@v3

      - name: 🐍 設定 Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          # 💡 蘇蘇提醒：直接把要用的套件寫在這裡，保證雲端一定會裝到
          pip install pandas requests lxml html5lib fugle-marketdata python-dotenv python-dateutil>=2.8.2 FinMind>=1.5.4

      - name: 🚀 啟動 StockCatcher 監控引擎
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 💡 根據你的錯誤路徑，嘗試進入正確的資料夾
          # 如果你的 scanner.py 在 stockcatcher 資料夾裡，就執行下面這行
          cd stockcatcher
          python -u scanner.py  # -u 會強迫 print 立即顯示